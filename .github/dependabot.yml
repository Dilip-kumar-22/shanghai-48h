version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain hygiene).
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8 supports TypeScript < 6.1. Remove once it supports newer releases.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
